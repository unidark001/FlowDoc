<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100f14">
    <meta name="description" content="Sign in to your FlowDoc account.">
    <title>Sign in — FlowDoc</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body class="auth-page">
    <div class="shape-grid page-shape-grid" aria-hidden="true">
      <canvas class="shape-grid-canvas"></canvas>
    </div>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="sign-in-title">
        <div class="auth-promo">
          <a class="auth-brand" href="index.html" aria-label="FlowDoc home">
            <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <path d="M7 6.5h12.5a5 5 0 0 1 5 5v14H12a5 5 0 0 1-5-5v-14Z" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11h7.5M12 15h8M12 19h5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <span>FlowDoc</span>
          </a>
          <div class="auth-promo-copy">
            <p class="auth-promo-label">Protect what<br>matters.</p>
            <p>Clearer decisions<br>for everyday life.</p>
          </div>
        </div>

        <div class="auth-form-column">
          <a class="auth-back" href="index.html"><span aria-hidden="true">←</span> Back to FlowDoc</a>
          <h1 id="sign-in-title">Sign in</h1>
          <div class="auth-mode-switch" role="group" aria-label="Account mode">
            <button type="button" class="text-button" data-auth-mode="signin" aria-pressed="true">Sign in</button>
            <button type="button" class="text-button" data-auth-mode="signup" aria-pressed="false">Create account</button>
          </div>

          <div class="social-auth" role="group" aria-label="Sign in with a provider">
            <button type="button" data-auth-provider="Google">
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.5h3.2c1.9-1.8 3.1-4.3 3.1-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2 1-3.5 1-2.6 0-4.8-1.8-5.6-4.2H3.1v2.6A10.1 10.1 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9l3.3-2.6Z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.9 14.7 2 12 2a10.1 10.1 0 0 0-8.9 5.5l3.3 2.6C7.2 7.7 9.4 5.9 12 5.9Z"/></svg>
              Continue with Google
            </button>
          </div>

          <div class="auth-divider"><span>or use email</span></div>

          <form class="sign-in-form" novalidate>
            <div class="form-field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required aria-describedby="email-error">
              <p class="field-error" id="email-error" hidden></p>
            </div>
            <div class="form-field">
              <div class="field-header">
                <label for="password">Password</label>
                <button class="forgot-password text-button" type="button" id="forgot-password">Forgot password?</button>
              </div>
              <div class="password-field">
                <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required minlength="8" aria-describedby="password-error">
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="password">
                  <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
                  <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c5.5 0 9 7 9 7a17.5 17.5 0 0 1-2.4 3.4M6.1 6.1C3.9 7.7 3 12 3 12s3.5 7 9 7a9.7 9.7 0 0 0 3.2-.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <p class="field-error" id="password-error" hidden></p>
            </div>
            <button class="auth-continue" type="submit">Sign in</button>
          </form>

          <p class="auth-feedback" role="status" aria-live="polite"></p>
          <p class="auth-switch">No account? <a href="pricing.html">Start with 3 free checks</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
