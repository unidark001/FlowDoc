<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100f14">
    <meta name="description" content="Sign in to your FlowDoc account.">
    <title>Sign in — FlowDoc</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body class="auth-page">
    <div class="shape-grid page-shape-grid" aria-hidden="true">
      <canvas class="shape-grid-canvas"></canvas>
    </div>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="sign-in-title">
        <div class="auth-promo">
          <a class="auth-brand" href="index.html" aria-label="FlowDoc home">
            <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <path d="M7 6.5h12.5a5 5 0 0 1 5 5v14H12a5 5 0 0 1-5-5v-14Z" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11h7.5M12 15h8M12 19h5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <span>FlowDoc</span>
          </a>
          <div class="auth-promo-copy">
            <p class="auth-promo-label">Protect what<br>matters.</p>
            <p>Clearer decisions<br>for everyday life.</p>
          </div>
        </div>

        <div class="auth-form-column">
          <h1 id="sign-in-title">Sign in</h1>

          <div class="social-auth" aria-label="Social sign in options">
            <button type="button">
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.7c0-2 1.7-3 1.8-3.1a4 4 0 0 0-3.2-1.7c-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8a4.5 4.5 0 0 0-3.8 2.3c-1.6 2.8-.4 7 1.1 9.3.8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.3-2.7 1.3-2.7s-2.1-.8-2.1-4.1ZM14.2 6.5c.6-.8 1-1.9.9-3-1 .1-2.2.7-2.8 1.5-.6.7-1.1 1.8-.9 2.9 1.1.1 2.2-.5 2.8-1.4Z"/></svg>
              Sign in with Apple
            </button>
            <button type="button">
              <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.5h3.2c1.9-1.8 3.1-4.3 3.1-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2 1-3.5 1-2.6 0-4.8-1.8-5.6-4.2H3.1v2.6A10.1 10.1 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9l3.3-2.6Z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.9 14.7 2 12 2a10.1 10.1 0 0 0-8.9 5.5l3.3 2.6C7.2 7.7 9.4 5.9 12 5.9Z"/></svg>
              Sign in with Google
            </button>
          </div>

          <div class="auth-divider"><span>or</span></div>

          <form class="sign-in-form">
            <label class="sr-only" for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
            <label class="sr-only" for="password">Password</label>
            <div class="password-field">
              <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
              <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c5.5 0 9 7 9 7a17.5 17.5 0 0 1-2.4 3.4M6.1 6.1C3.9 7.7 3 12 3 12s3.5 7 9 7a9.7 9.7 0 0 0 3.2-.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <button class="auth-continue" type="submit">Sign in</button>
          </form>

          <a class="forgot-password" href="mailto:support@flowdoc.example?subject=Password%20reset">Forgot password?</a>
          <p class="auth-switch">No account? <a href="pricing.html">Sign up</a></p>
          <p class="auth-feedback" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
  </body>
</html>
